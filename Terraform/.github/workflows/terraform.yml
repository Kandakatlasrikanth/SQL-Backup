name: Multiple jobs

on:
  push:
    branches: [KANTH]
  workflow_dispatch:

jobs:
  terraform-check:
    name: Check Terraform
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Terraform
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Initialize
        run: terraform init -backend=false

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Validate
        run: terraform validate

  service-report:
    name: Create service report
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run PowerShell
        shell: pwsh
        run: |
          Get-Service |
            Select-Object -First 5 Name, Status |
            Out-File -FilePath "$env:GITHUB_WORKSPACE\service.txt" -Encoding utf8

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: service-report
          path: service.txt

  after-checks:
    name: Run after Terraform check
    needs: terraform-check
    runs-on: windows-latest
    steps:
      - run: Write-Output "Terraform validation passed"
        shell: pwsh