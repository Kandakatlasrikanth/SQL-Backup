name: Ola Hallengren Backup

on:
  workflow_dispatch:

jobs:
  ola-backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      - name: Install Windows Ansible collection
        run: |
          ansible-galaxy collection install ansible.windows

      - name: Check Ansible
        run: |
          ansible --version

      - name: Check inventory
        run: |
          ansible-inventory -i ansible/inventory.ini --graph

      - name: Test Windows connectivity
        run: |
          ansible -i ansible/inventory.ini windows -m ansible.windows.win_ping

      - name: Run Ola Hallengren backup
        run: |
          ansible-playbook \
            -i ansible/inventory.ini \
            ansible/ola-backup.yml