name: Ola Hallengren Backup

on:
  workflow_dispatch:

jobs:
  ola-backup:

    # IMPORTANT:
    # Use your Windows self-hosted runner.
    # Change the labels if your runner has different labels.
    runs-on:
      - self-hosted
      - Windows
      - x64

    steps:

      # ==========================================================
      # 1. Checkout repository
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================================
      # 2. Check PowerShell
      # ==========================================================
      - name: Check PowerShell
        shell: powershell
        run: |
          Write-Host "PowerShell version:"
          $PSVersionTable.PSVersion

      # ==========================================================
      # 3. Check Python
      # ==========================================================
      - name: Check Python
        shell: powershell
        run: |
          python --version
          python -m pip --version

      # ==========================================================
      # 4. Create Python virtual environment
      # ==========================================================
      - name: Create Python virtual environment
        shell: powershell
        run: |
          if (Test-Path ".venv") {
              Remove-Item ".venv" -Recurse -Force
          }

          python -m venv .venv

      # ==========================================================
      # 5. Install Ansible + WinRM dependencies
      # ==========================================================
      - name: Install Ansible and WinRM dependencies
        shell: powershell
        run: |
          .\.venv\Scripts\python.exe -m pip install --upgrade pip

          .\.venv\Scripts\python.exe -m pip install `
            ansible `
            pywinrm `
            requests `
            requests-ntlm

      # ==========================================================
      # 6. Install Ansible Windows collection
      # ==========================================================
      - name: Install Ansible Windows collection
        shell: powershell
        run: |
          .\.venv\Scripts\ansible-galaxy.exe collection install ansible.windows

      # ==========================================================
      # 7. Verify Ansible installation
      # ==========================================================
      - name: Verify Ansible
        shell: powershell
        run: |
          .\.venv\Scripts\ansible.exe --version

          .\.venv\Scripts\python.exe -c "import winrm; print('pywinrm installed successfully')"

      # ==========================================================
      # 8. Check Windows server network connectivity
      # ==========================================================
      - name: Test network connectivity
        shell: powershell
        run: |
          Write-Host "Testing 192.168.1.2..."
          Test-NetConnection 192.168.1.2 -Port 5985

          Write-Host "Testing 192.168.1.3..."
          Test-NetConnection 192.168.1.3 -Port 5985

      # ==========================================================
      # 9. Check Ansible inventory
      # ==========================================================
      - name: Check Ansible inventory
        shell: powershell
        run: |
          .\.venv\Scripts\ansible-inventory.exe `
            -i ansible\inventory.ini `
            --graph

      # ==========================================================
      # 10. Validate inventory variables
      # ==========================================================
      - name: Show Ansible host variables
        shell: powershell
        run: |
          .\.venv\Scripts\ansible-inventory.exe `
            -i ansible\inventory.ini `
            --host 192.168.1.2

          .\.venv\Scripts\ansible-inventory.exe `
            -i ansible\inventory.ini `
            --host 192.168.1.3

      # ==========================================================
      # 11. Test Windows WinRM connectivity
      # ==========================================================
      - name: Test Windows connectivity
        shell: powershell
        run: |
          .\.venv\Scripts\ansible.exe `
            -i ansible\inventory.ini `
            windows `
            -m ansible.windows.win_ping `
            -vv

      # ==========================================================
      # 12. Run Ola Hallengren backup
      # ==========================================================
      - name: Run Ola Hallengren backup
        shell: powershell
        run: |
          .\.venv\Scripts\ansible-playbook.exe `
            -i ansible\inventory.ini `
            ansible\ola-backup.yml `
            -vv

      # ==========================================================
      # 13. Backup completion
      # ==========================================================
      - name: Backup completed
        if: success()
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host " Ola Hallengren backup completed SUCCESSFULLY"
          Write-Host "=========================================="

      # ==========================================================
      # 14. Backup failed
      # ==========================================================
      - name: Backup failed
        if: failure()
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host " Ola Hallengren backup FAILED"
          Write-Host " Check the previous step for the error."
          Write-Host "=========================================="

