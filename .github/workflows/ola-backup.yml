name: Ola Hallengren Backup

on:
  workflow_dispatch:

jobs:
  ola-backup:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Ansible
        shell: powershell
        run: |
          wsl ansible --version

      - name: Check inventory
        shell: powershell
        run: |
          wsl bash -lc "cd /mnt/c/Users/ADMINISTRATOR/_work/SQL-Backup/SQL-Backup && ansible-inventory -i ansible/inventory.ini --graph"

      - name: Run Ola Hallengren backup
        shell: powershell
        run: |
          wsl bash -lc "cd /mnt/c/Users/ADMINISTRATOR/_work/SQL-Backup/SQL-Backup && ansible-playbook -i ansible/inventory.ini ansible/ola-backup.yml"